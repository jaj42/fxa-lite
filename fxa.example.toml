# fxa-lite configuration.
#
# Relative paths are resolved against the directory holding this file.

# The origin Firefox is pointed at via identity.fxaccounts.autoconfig.uri.
# Everything — accounts API, OAuth, profile, sign-in page, tokenserver and sync
# storage — is served below it.
public_url = "http://localhost:9000"

# HMAC secret shared by the tokenserver and sync storage tiers. Upstream this
# must be set, because the two are separate deployments that have to be told the
# same string; here they are one process, so leaving it out is the normal case —
# one is derived from the signing key instead. Set it only if you mean to pin it
# independently of that key. Changing either invalidates outstanding sync tokens,
# which costs clients one extra request.
# tokenserver_shared_secret = "change-me"

[listen]
host = "127.0.0.1"
port = 9000

[paths]
database = "fxa.sqlite"
signing_key = "signing-key.json"
# Public JWK of a retired signing key, kept in /v1/jwks so tokens signed before
# a rotation still verify.
# retired_key = "retired-key.json"

[log]
# "info" (the default), "debug", "warning" or "error". At "debug" every request
# and response is written out with its body, which is how you find out why a
# browser is unhappy — an access log line says a request was a 400, not which
# field was wrong. Credentials are redacted to a prefix and a length, but the
# output still describes someone's account: treat it as sensitive.
# level = "debug"

[ttl]
# Seconds. access_token stays at or below 6h so tokens need no server-side store.
access_token = 21600
authorization_code = 900
tokenserver_token = 3600

# OAuth clients. Firefox Desktop, Fenix and Firefox for iOS are registered
# automatically with the ids and scopes the reference server gives them, so
# most deployments need nothing here.
#
# An entry whose id matches a built-in replaces it wholesale — nothing is
# merged, so whatever is written below is exactly what that client gets.
#
# [[clients]]
# id = "0011223344556677"                 # 16 hex characters
# name = "Thunderbird"
# redirect_uris = ["https://mail.example.com/oauth"]
# allowed_scopes = "https://identity.thunderbird.net/apps/sync"
# trusted = true                          # may ask for scopes beyond profile:*
# can_grant = true
# public_client = true                    # PKCE required, no client secret
