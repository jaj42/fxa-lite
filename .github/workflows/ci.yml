# The claim this workflow exists to stop being a claim.
#
# "`ruff check` and `ty check` clean" closed six phases of plan.md, each time as
# something a human ran once on one machine. Nothing enforced it, nothing
# recorded it, and a phase that ended green could be reopened by the next
# phase's first commit without anyone finding out until the phase after that.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest, ruff, ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `node` is not a convenience here. `tests/js/*.mjs` are the only coverage
      # of `content/assets/*.js` — the password stretching, the key unbundling
      # and the `keys_jwe` seal all run in the browser, where pytest cannot
      # reach them — and without a runtime those suites *skip*. A green run that
      # exercised none of the browser crypto looks exactly like one that
      # exercised all of it, which is why `tests/nodejs.py` turns the skip into
      # a failure whenever `CI` is set. GitHub sets `CI`, so removing this step
      # breaks the build rather than quietly halving it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--locked` rather than `--frozen`: a `uv.lock` that no longer matches
      # `pyproject.toml` should fail here, not resolve differently in CI than it
      # does on the machine that wrote the change.
      - name: Install
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check

      - name: Types
        run: uv run ty check

      # Built here as well as in docs.yml, because a broken `{ref}` in a
      # docstring is a code change and should fail the code job. `-W` makes an
      # unresolved cross-reference fatal; this documentation is very nearly
      # nothing but cross-references.
      - name: Docs
        run: uv run sphinx-build -W -b html docs docs/_build/html

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only: there is no registry to push to and nothing here needs one.
      # What this catches is the thing `tests/test_docker.py` cannot — a base
      # image digest that has been withdrawn, a `uv sync` that no longer
      # resolves inside the builder stage, a `COPY` of a path that moved.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
