# fxa-lite: one service, one volume.
#
#   docker compose run --rm    fxa-lite keygen
#   docker compose run --rm -it fxa-lite account add you@example.com
#   docker compose up -d
#
# The first two are administrative acts on the machine holding the database and
# stay interactive: `account add` prompts through getpass, and nothing in this
# file generates a secret on your behalf.  Put fxa.toml in the volume first —
# `cp fxa.example.toml` into it, or write it with
# `docker compose run --rm --entrypoint sh fxa-lite -c 'cat > /data/fxa.toml'`.
#
# `docker compose --profile tls up -d` additionally starts the nginx below, and
# is the public deployment: the sign-in page derives the password with
# crypto.subtle, which browsers expose only in a secure context, so over plain
# HTTP a phone cannot sign in at all.
#
# Two operational facts:
#
#   * SQLite over NFS or SMB has broken locking, and the household NAS this
#     image exists for is the machine most likely to get that wrong.  /data must
#     be a local filesystem or, as below, a named volume backed by one.
#
#   * Backup is `docker compose stop` and a copy of one directory (or
#     `sqlite3 /data/fxa.sqlite ".backup /data/backup.sqlite"` while it runs).
#     That is the entire disaster-recovery story, and it is a feature.

name: fxa-lite

services:
  fxa-lite:
    build: .
    image: fxa-lite:latest
    restart: unless-stopped

    # Also set in the Dockerfile; repeated here because it is what a bind mount
    # of a host directory has to be chowned to.  A named volume, as configured
    # below, inherits /data's ownership from the image and needs nothing.
    user: "1000:1000"

    # All state is in /data, so the root filesystem has no reason to be
    # writable.  uvicorn wants a /tmp; nothing else does.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

    volumes:
      - data:/data

    # Host loopback only.  The container binds 0.0.0.0 because inside a network
    # namespace 127.0.0.1 is nothing but the container itself — unreachable even
    # by the healthcheck — so the loopback binding moves out here, to the host,
    # in front of whatever terminates TLS.
    #
    # Under `--profile tls` nginx reaches this over the compose network instead
    # and the publication is only useful for local debugging: comment it out and
    # the app becomes reachable through the proxy and nowhere else.
    ports:
      - "127.0.0.1:9000:9000"

    # /__heartbeat__, not /__lbheartbeat__: it pings the database, so it can
    # tell a failed volume mount from a healthy process.  Duplicated from the
    # Dockerfile's HEALTHCHECK so that the `depends_on` below has a condition
    # even on a runtime whose image format drops that instruction (podman).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/__heartbeat__', timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Opt-in TLS terminator: `docker compose --profile tls up -d`.
  #
  # It does not run certbot, and it will not.  Issuance is one command on the
  # host —
  #
  #   certbot certonly --webroot -w /var/www/certbot -d fxa.example.com
  #
  # — plus a renewal hook that reloads this container:
  #
  #   echo 'docker compose -f /srv/fxa-lite/docker-compose.yaml exec nginx nginx -s reload' \
  #       > /etc/letsencrypt/renewal-hooks/deploy/fxa-lite.sh && chmod +x "$_"
  #
  # A compose file that mints certificates is exactly the
  # entrypoint-generates-secrets pattern the app service refuses.
  nginx:
    profiles: ["tls"]
    image: nginx:1.29.3-alpine@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
    restart: unless-stopped
    depends_on:
      fxa-lite:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # `cp deploy/nginx.conf.example deploy/nginx.conf` and edit it first:
      # server_name, the certificate paths, and the one upstream line that
      # differs between host nginx and this container.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: ["ALL"]
    # What the stock image's entrypoint needs to bind :80/:443 and then drop
    # from root to the nginx user.
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]

volumes:
  data:
