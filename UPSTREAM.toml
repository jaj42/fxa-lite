# What "the reference" means.
#
# fxa-lite is a reimplementation, not a fork: every protocol constant in plan.md and every
# "matches the reference" claim in the source was read out of a checkout under `resources/`,
# which is gitignored and untracked.  Without this file that provenance lives only on the
# machine that did the reading, and a claim that cannot name its source is not a claim.
#
# Each entry pins one checkout to the commit fxa-lite was read against, and lists the paths
# that were actually read — not the repository.  mozilla/fxa is a monorepo whose churn is
# overwhelmingly subscriptions, Glean and the settings SPA, none of which we implement; the
# point of the path list is that `scripts/upstream-diff.sh` shows a protocol change as a
# handful of commits instead of two thousand irrelevant ones.
#
# Bump a pin only together with the code change, or the note, that answers its diff.  The file
# then always means "fxa-lite is current with respect to this commit", never "this is where we
# last happened to look".
#
# `tests/test_upstream.py` asserts every path below still exists in its checkout, and skips
# when `resources/` is absent.  Upstream renames files, and a stale path makes the diff *empty*
# — which reads as "nothing changed", the one failure mode this file cannot survive.

[[repo]]
dir = "fxa"
url = "https://github.com/mozilla/fxa"
branch = "main"
commit = "f87b36d0b92435869d2419993b1b5176b322b871"
date = "2026-08-24"
took = "the onepw protocol and its KATs, token derivation, the accounts/OAuth/profile wire format, and the WebChannel handshake"
paths = [
  # The client half of onepw — ported into tests/conformance/client.py — and its own test
  # vectors, transcribed into tests/vectors/.
  "packages/fxa-auth-client/lib",
  "packages/fxa-auth-client/test",
  # quickStretch, scrypt, verifyHash/wrapwrapKey, and the *.spec.ts files that pin them.
  "packages/fxa-auth-server/lib/crypto",
  # tokenTypeID derivation and the single-use keyFetchToken bundle, likewise with their specs.
  "packages/fxa-auth-server/lib/tokens",
  # grant.js, jwt_access_token.js (incl. the oldsync `aud` swap), keys.ts, validators.js.
  "packages/fxa-auth-server/lib/oauth",
  # hawk-fxa-token.js: the auth scheme we match, MAC-discarding included.
  "packages/fxa-auth-server/lib/routes/auth-schemes",
  # The routes fxa-lite serves, and the shared response furniture around them.
  "packages/fxa-auth-server/lib/routes/account.ts",
  "packages/fxa-auth-server/lib/routes/session.js",
  "packages/fxa-auth-server/lib/routes/devices-and-sessions.js",
  # Its spec is the citation for what /account/devices/notify answers when the
  # deployment does not do device-driven notifications: 403, errno 202.
  "packages/fxa-auth-server/lib/routes/devices-and-sessions.spec.ts",
  "packages/fxa-auth-server/lib/routes/emails.js",
  "packages/fxa-auth-server/lib/routes/oauth",
  # attached_clients, plus the spec whose fixture is transcribed as its KAT.
  "packages/fxa-auth-server/lib/routes/attached-clients.js",
  "packages/fxa-auth-server/lib/routes/attached-clients.spec.ts",
  "packages/fxa-auth-server/lib/routes/defaults.js",
  "packages/fxa-auth-server/lib/routes/util.js",
  "packages/fxa-auth-server/lib/routes/validators.js",
  "packages/fxa-auth-server/lib/devices.js",
  # Where the three browser client ids, scopes and redirect URIs come from.
  "packages/fxa-auth-server/config/dev.json",
  # Read narrowly, for what a switch means rather than for its value —
  # deviceNotificationsEnabled is documented there as a temporary safety switch,
  # which is why fxa-lite's permanent version of it answers differently.
  "packages/fxa-auth-server/config/index.ts",
  # The errno table behind errors.py.
  "libs/accounts/errors/src",
  # Scoped keys, the oldsync special case, and the keys_jwe bundle — plus their specs.
  "libs/vendored/crypto-relier/src/lib/deriver",
  # ScopeSet, ported to oauth/scopes.py, and the KATs it is checked against.
  "packages/fxa-shared/oauth/scopes.ts",
  "packages/fxa-shared/test/oauth/scopes.js",
  # ConnectedServicesFactory: the merge behind /account/attached_clients.
  "packages/fxa-shared/connected-services",
  # The profile server: a second errno table and the /v1/{profile,email,uid,display_name} set.
  "packages/fxa-profile-server/lib/error.js",
  "packages/fxa-profile-server/lib/routes",
  # WebChannel: command names and envelope, and two working emitters to copy structure from.
  "packages/fxa-settings/src/lib/channels/firefox.ts",
  "packages/fxa-settings/src/pages/Signin/utils.ts",
  "packages/fxa-settings/src/pages/WebChannelExample/index.tsx",
  "packages/functional-tests/pages/layout.ts",
  # fx-sync-channel.js — the fields the browser side requires of a login message.
  "packages/fxa-content-server/app/scripts/models/auth_brokers",
  # The discovery document Firefox reads before anything else.
  "packages/fxa-content-server/server/lib/routes/get-fxa-client-configuration.js",
  # The about:config prefs phase 8 sets on a fresh profile.
  "packages/fxa-dev-launcher/profile.mjs",
]

