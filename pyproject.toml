[project]
name = "fxa-lite"
version = "0.1.0"
description = "A slim, self-hosted Mozilla Accounts + Sync stack: one process, one SQLite file"
readme = "README.md"
requires-python = ">=3.12"
# MPL-2.0 because every upstream fxa-lite took from is MPL-2.0, and several files
# here are ports rather than independent work — see docs/provenance.md, Licensing.
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jona JOACHIM", email = "jona@joachim.cc" }
]
dependencies = [
    "cryptography>=46",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
fxa-lite = "fxa_lite.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
# Never a runtime dependency: nothing under `src/` imports any of these, and
# `uv build` ships none of them. They are a default group all the same, because
# `docs/_ext/` is first-party Python that `ruff check` and `ty check` read like
# any other file — a docs extension excluded from both is a docs extension that
# breaks on the day nobody is watching.
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
    "sphinxcontrib-mermaid>=1.0.0",
    "types-docutils>=0.21",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ty.environment]
# `docs/_ext` is on `sys.path` for Sphinx (see `docs/conf.py`) and for the test
# that imports the scanner directly, but it is not a package and nothing
# installs it. Both tools have to be told, or the extensions type-check as a
# pair of unresolved imports.
extra-paths = ["docs/_ext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests", "docs/_ext"]

[tool.ruff.lint]
# `S` is flake8-bandit: the mechanical half of the phase 10 security audit, kept
# on so a new `==` on a secret or a new f-string query has to be argued for in a
# `noqa` rather than merged unnoticed.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# The test suite is the one place where a hardcoded password is the point, an
# `assert` is the whole vocabulary, and `subprocess` runs `node` or `git` with
# arguments written three lines above the call.
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S603", "S607"]
# Sphinx names the config values it reads, and every one of them is a module-level
# assignment that looks like a shadowed builtin or an unused global.
"docs/conf.py" = ["A001", "E402"]
