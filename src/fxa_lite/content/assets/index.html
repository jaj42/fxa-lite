<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The URL carries keys_jwk, state and code_challenge; none of it should
         ever ride along on an outbound request. -->
    <meta name="referrer" content="no-referrer" />
    <title>Sign in — fxa-lite</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <main id="app" class="card">
      <noscript>
        <h1>JavaScript is required</h1>
        <p class="subtitle">
          Your password is stretched in this page and never sent to the server,
          so signing in cannot work without JavaScript.
        </p>
      </noscript>
    </main>
    <footer>fxa-lite</footer>
  </body>
</html>
